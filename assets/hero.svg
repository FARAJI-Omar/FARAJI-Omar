<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="Omar Faraji — Full Stack Developer"><title id="heroTitle">Omar Faraji — Full Stack Developer</title>
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#151925" />
          <stop offset="0.65" stop-color="#272b3a" />
          <stop offset="1" stop-color="#323647" />
        </linearGradient>
        <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd166" />
          <stop offset="1" stop-color="#f9a825" />
        </linearGradient>
        <radialGradient id="glow">
          <stop offset="0" stop-color="#f9a825" stop-opacity="0.45" />
          <stop offset="1" stop-color="#f9a825" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f9a825" stop-opacity="0.05" />
          <stop offset="1" stop-color="#f9a825" stop-opacity="0.5" />
        </linearGradient>
        <mask id="sunmask">
          <rect width="880" height="260" fill="#fff" />
          <g fill="#000">
            <rect x="600" y="132" width="200" height="4" />
            <rect x="600" y="143" width="200" height="5" />
            <rect x="600" y="155" width="200" height="6" />
            <rect x="600" y="168" width="200" height="7" />
          </g>
        </mask>
        <clipPath id="above"><rect x="0" y="0" width="880" height="178" /></clipPath>
        <filter id="soft"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f9a825" flood-opacity="0.35" /></filter>
        <style>
          .tw { animation: tw 4.5s ease-in-out infinite; transform-origin: center; }
          .tw:nth-child(3n) { animation-delay: -1.6s; }
          .tw:nth-child(3n+1) { animation-delay: -3.1s; }
          .sunpulse { animation: pulse 6s ease-in-out infinite; }
          .sweep { animation: sweep 9s linear infinite; }
          .gridpulse { animation: gp 7s ease-in-out infinite; }
          .approach { transform-box: view-box; transform-origin: 700px 178px; animation: approach 22s ease-in-out infinite; }
          .flow line { stroke-dasharray: 3 26; animation: flow 1.1s linear infinite; }
          @keyframes approach { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.16); } }
          @keyframes flow { to { stroke-dashoffset: -29; } }
          @keyframes tw { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.95; } }
          @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.95; } }
          @keyframes sweep { from { transform: translateY(-8px); } to { transform: translateY(268px); } }
          @keyframes gp { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.95; } }
          @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
        </style>
      </defs>

      <rect width="880" height="260" fill="url(#sky)" />

      <g fill="#fff">
        <circle class="tw" cx="38" cy="34" r="1.3" />
        <circle class="tw" cx="96" cy="64" r="1" />
        <circle class="tw" cx="158" cy="26" r="1.5" />
        <circle class="tw" cx="214" cy="72" r="1" />
        <circle class="tw" cx="268" cy="42" r="1.2" />
        <circle class="tw" cx="330" cy="22" r="1" />
        <circle class="tw" cx="392" cy="58" r="1.4" />
        <circle class="tw" cx="470" cy="32" r="1" />
        <circle class="tw" cx="540" cy="66" r="1.2" />
        <circle class="tw" cx="606" cy="28" r="1" />
        <circle class="tw" cx="664" cy="54" r="1.4" />
        <circle class="tw" cx="742" cy="24" r="1" />
        <circle class="tw" cx="806" cy="62" r="1.2" />
        <circle class="tw" cx="850" cy="30" r="1" />
      </g>

      <g class="approach">
        <circle class="sunpulse" cx="700" cy="178" r="150" fill="url(#glow)" />

        <g clip-path="url(#above)">
          <circle cx="700" cy="178" r="80" fill="url(#sun)" mask="url(#sunmask)" />
        </g>

        <g class="gridpulse" stroke="url(#fade)" stroke-width="1">
          <line x1="700" y1="178" x2="-260" y2="260" />
          <line x1="700" y1="178" x2="-80" y2="260" />
          <line x1="700" y1="178" x2="100" y2="260" />
          <line x1="700" y1="178" x2="280" y2="260" />
          <line x1="700" y1="178" x2="460" y2="260" />
          <line x1="700" y1="178" x2="640" y2="260" />
          <line x1="700" y1="178" x2="820" y2="260" />
          <line x1="700" y1="178" x2="1000" y2="260" />
          <line x1="700" y1="178" x2="1180" y2="260" />
          <line x1="0" y1="184" x2="880" y2="184" />
          <line x1="0" y1="191" x2="880" y2="191" />
          <line x1="0" y1="199" x2="880" y2="199" />
          <line x1="0" y1="209" x2="880" y2="209" />
          <line x1="0" y1="221" x2="880" y2="221" />
          <line x1="0" y1="236" x2="880" y2="236" />
        </g>

        <g class="flow" stroke="#f9a825" stroke-width="2" opacity="0.4">
          <line x1="700" y1="178" x2="-260" y2="260" />
          <line x1="700" y1="178" x2="-80" y2="260" />
          <line x1="700" y1="178" x2="100" y2="260" />
          <line x1="700" y1="178" x2="280" y2="260" />
          <line x1="700" y1="178" x2="460" y2="260" />
          <line x1="700" y1="178" x2="640" y2="260" />
          <line x1="700" y1="178" x2="820" y2="260" />
          <line x1="700" y1="178" x2="1000" y2="260" />
          <line x1="700" y1="178" x2="1180" y2="260" />
        </g>
      </g>

      <line x1="0" y1="178" x2="880" y2="178" stroke="#f9a825" stroke-opacity="0.45" />

      <rect class="sweep" x="0" y="0" width="880" height="1.5" fill="#f9a825" opacity="0.22" />

      <text x="56" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="6" fill="#ffffff" filter="url(#soft)">OMAR FARAJI</text>
      <text x="56" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="5" fill="#f9a825">FULL STACK DEVELOPER</text>
      <text x="56" y="236" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="1" fill="#9aa0ad">omarfaraji.me</text>
    </svg>